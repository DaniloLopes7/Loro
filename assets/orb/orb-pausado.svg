<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Esfera do Loro: pausado">
  <title>Pausado</title>
  <g transform="translate(120 120)">
    <circle r="72" fill="none" stroke="#E7E2DC" stroke-width="6">
      <animateTransform attributeName="transform" type="scale" values="1;1.02;1" keyTimes="0;0.5;1" dur="5s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" keyTimes="0;0.5;1" dur="5s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
